services:
  - type: web
    name: HalicMind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -c requirements.lock.txt
    startCommand: python -m scripts.start_production
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: halicmind
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_ORIGIN
        value: https://halicmind.com
      - key: SERVE_FRONTEND
        value: true
      - key: MAIL_PROVIDER
        value: gmail
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: halicmind@gmail.com
      - key: EXAM_SYNC_ENABLED
        value: true
